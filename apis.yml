name: Patch Biosciences
description: >-
  Patch Biosciences was a synthetic-biology and machine-learning company,
  founded in 2020 and based in New York, that built an AI platform for genetic
  sequence design — computationally engineering DNA "cargos" and regulatory
  elements to make gene and RNA therapies more effective, specific, and durable.
  It was backed by Andreessen Horowitz (a16z) Bio + Health, Casdin Capital, and
  S32. Patch Biosciences was acquired by Ginkgo Bioworks in early 2024 and folded
  into Ginkgo's genetic-medicine services; it no longer operates as an
  independent company. Its former standalone website (patch.bio) is now parked
  and no public developer portal, API, or documentation surface exists. This
  profile is retained in the API Evangelist network as an acquired/defunct
  company record surfaced from a16z portfolio enrichment.
